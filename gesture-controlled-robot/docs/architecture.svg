<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="330" viewBox="0 0 1060 330">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.t{font-size:20px;font-weight:bold;fill:#1F3864}.b{fill:#EEF2FA;stroke:#1F3864;stroke-width:2}.h{fill:#1F3864}.ht{fill:#fff;font-weight:bold;font-size:15px}.l{font-size:14px}.s{font-size:12px;fill:#4b5563}.w{stroke:#1F3864;stroke-width:2;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker></defs>
<rect width="1060" height="330" fill="#fff"/><text class="t" x="40" y="40">Gesture-Controlled Robot: pipeline</text>
<rect class="b" x="40" y="70" width="200" height="80" rx="10"/>
<text class="l" x="140.0" y="106.0" text-anchor="middle">Webcam</text>
<text class="s" x="140.0" y="124.0" text-anchor="middle">OpenCV frame</text>
<rect class="b" x="300" y="70" width="200" height="80" rx="10"/>
<text class="l" x="400.0" y="106.0" text-anchor="middle">MediaPipe</text>
<text class="s" x="400.0" y="124.0" text-anchor="middle">21 hand landmarks</text>
<rect class="b" x="560" y="70" width="200" height="80" rx="10"/>
<text class="l" x="660.0" y="106.0" text-anchor="middle">Finger states</text>
<text class="s" x="660.0" y="124.0" text-anchor="middle">5-bit pattern</text>
<rect class="b" x="820" y="70" width="200" height="80" rx="10"/>
<text class="l" x="920.0" y="106.0" text-anchor="middle">Gesture</text>
<text class="s" x="920.0" y="124.0" text-anchor="middle">e.g. PEACE</text>
<rect class="b" x="40" y="220" width="200" height="80" rx="10"/>
<text class="l" x="140.0" y="256.0" text-anchor="middle">Debounce</text>
<text class="s" x="140.0" y="274.0" text-anchor="middle">5 stable frames</text>
<rect class="b" x="300" y="220" width="200" height="80" rx="10"/>
<text class="l" x="400.0" y="256.0" text-anchor="middle">Mapping</text>
<text class="s" x="400.0" y="274.0" text-anchor="middle">gesture_map.json</text>
<rect class="b" x="560" y="220" width="200" height="80" rx="10"/>
<text class="l" x="660.0" y="256.0" text-anchor="middle">JSON command</text>
<text class="s" x="660.0" y="274.0" text-anchor="middle">+ serial line</text>
<rect class="b" x="820" y="220" width="200" height="80" rx="10"/>
<text class="l" x="920.0" y="256.0" text-anchor="middle">Arduino servos</text>
<text class="s" x="920.0" y="274.0" text-anchor="middle">or on-screen arm</text>
